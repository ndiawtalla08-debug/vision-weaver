name = "toutsuite-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Adresse du site autorisée à appeler l'API (séparer par des virgules).
ALLOWED_ORIGINS = "https://vision-display-store.lovable.app"

# Base D1 existante (ne pas en créer une nouvelle).
[[d1_databases]]
binding = "DB"
database_name = "toutsuite-annonces-db"
database_id = "5ec829c9-4e94-4ec7-92e1-41e1173bc239"
migrations_dir = "migrations"
