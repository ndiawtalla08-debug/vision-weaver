name = "toutsuite-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Sites autorisés à communiquer avec l'API
ALLOWED_ORIGINS = "https://toutsuiteannonces.com,https://vision-display-store.lovable.app"

# Configuration Google OAuth
GOOGLE_CLIENT_ID = "1071299259299-4vh6besjus6fk1sb757ceovfb9977jph.apps.googleusercontent.com"

# Base D1 existante (ne pas en créer une nouvelle).
[[d1_databases]]
binding = "DB"
database_name = "toutsuite-annonces-db"
database_id = "5ec829c9-4e94-4ec7-92e1-41e1173bc239"
migrations_dir = "migrations"
   # Stockage des images avec Cloudflare R2
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "toutsuite-annonces-images"